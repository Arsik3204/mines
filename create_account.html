<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create account</title>
  <link rel="stylesheet" href="css/create_account.css">
</head>
<body>

<canvas id="starfield"></canvas>

<header>
  <div class="container">
    <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer">✦<span>Vinted</span></div>
    <div class="auth">
      <button class="btn" onclick="window.location.href='sign_in.html'">Sign In</button>
      <button class="btn btn-primary">Create Account</button>
    </div>
  </div>
</header>

<div class="container-body">
  <div class="content-wrapper">
    <h1>LISTEN.</h1>
    <h1>UPLOAD.</h1>
    <h1>DISCOVER.</h1>

    <form class="login-form" action="/register" method="POST" id="loginForm">
      <div class="field">
        <label for="email">Email or Username</label>
        <input type="text" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required>
        <div class="error-msg" id="errorMsg">Passwords do not match</div>
      </div>

      <button type="submit" class="btn-submit">Start listening</button>

      <div class="form-footer">
        Do you have an account? <a href="sign_in.html">Sign In</a>
      </div>
    </form>

  </div>
</div>

<script src="js/create_account.js"></script>
</body>
</html>
