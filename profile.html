<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Vinted</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<canvas id="starfield"></canvas>

<header>
    <div class="container">
        <div class="logo" onclick="window.location.href='index.html'">✦<span>Vinted</span></div>
        <div class="auth">
            <a href="/logout" class="btn btn-primary">Logout</a>
        </div>
    </div>
</header>

<div class="container-body">
    <div class="profile-wrapper">
        <div class="tabs">
            <div class="tab active" data-target="tab-profile">Profile</div>
            <div class="tab" data-target="tab-snippets">Snippets</div>
        </div>

        <div id="tab-profile" class="tab-content active">
            <div class="card profile-card">
                <button class="edit-btn" id="openEditModalBtn">✎ Edit Profile</button>
                <div class="avatar" id="avatar">?</div>
                <div class="profile-info">
                    <h1 id="username">Profile</h1>
                    <p class="profile-email" id="userEmail">Загрузка...</p>
                    <div class="profile-meta">
                        <div class="meta-item"><span class="meta-label">Tracks</span><span class="meta-value" id="trackCount">0</span></div>
                        <div class="meta-item"><span class="meta-label">Playlists</span><span class="meta-value" id="playlistCount">0</span></div>
                        <div class="meta-item"><span class="meta-label">Snippets</span><span class="meta-value" id="snippetCount">0</span></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">My Tracks</h2>
                <div id="tracksContainer" class="list-container"></div>
                <div class="form-row" style="flex-direction: column; align-items: stretch; gap: 10px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newTrackTitle" class="form-input" placeholder="Track Title" required>
                        <input type="text" id="newTrackArtist" class="form-input" placeholder="Artist" required>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                        <div style="display: flex; gap: 15px;">
                            <label style="color: #888; font-size: 14px; cursor: pointer;">Audio: <input type="file" id="newTrackAudio" accept="audio/*" class="file-input" required></label>
                            <label style="color: #888; font-size: 14px; cursor: pointer;">Cover: <input type="file" id="newTrackCover" accept="image/*" class="file-input"></label>
                        </div>
                        <button class="action-btn" id="addTrackBtn">Upload Track</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">Playlists</h2>
                <div id="playlistsContainer" class="list-container"></div>
                <div class="form-row">
                    <input type="text" id="newPlaylistName" class="form-input" placeholder="Playlist Name">
                    <button class="action-btn" id="addPlaylistBtn">Create Playlist</button>
                </div>
            </div>
        </div>

        <div id="tab-snippets" class="tab-content">
            <div class="card">
                <h2 class="section-title">Post a Snippet</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <textarea id="newSnippetText" class="form-input" rows="3" placeholder="What's on your mind?"></textarea>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <input type="file" id="newSnippetAudio" accept="audio/*" class="file-input">
                        <button class="action-btn" id="addSnippetBtn">Publish Snippet</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2 class="section-title">My Snippets</h2>
                <div id="snippetsContainer"></div>
            </div>
        </div>
    </div>
</div>

<div class="player" id="musicPlayer">
    <div class="player-cover" id="playerCover"></div>
    <div class="player-info">
        <div class="player-title" id="playerTitle">Track Title</div>
        <div class="player-artist" id="playerArtist">Artist</div>
    </div>
    <div class="player-controls">
        <button id="prevBtn">⏮</button>
        <button id="playPauseBtn">▶</button>
        <button id="nextBtn">⏭</button>
    </div>
    <div class="player-progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
    </div>
    <button id="closePlayerBtn" class="close-player">&times;</button>
    <audio id="mainAudio"></audio>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <button class="close-btn" id="closeEditModalBtn">&times;</button>
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
            <div class="input-group">
                <label>Display Name</label>
                <input type="text" name="displayName" id="editName" placeholder="Your name">
            </div>
            <div class="input-group">
                <label>Avatar Image</label>
                <input type="file" name="avatar" accept="image/*" class="file-input">
            </div>
            <button type="submit" class="action-btn" style="width: 100%;">Save Changes</button>
        </form>
    </div>
</div>

<script src="js/profile.js"></script>
</body>
</html>
