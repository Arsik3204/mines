<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link rel="stylesheet" href="css/sign_in.css">
</head>
<body>



<header>
  <canvas id="starfield"></canvas>
  <div class="container">
    <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer">✦<span>Vinted</span></div>
    <div class="auth">
      <button class="btn" onclick="window.location.href='sign_in.html'">Sign In</button>
      <button class="btn btn-primary" onclick="window.location.href='create_account.html'">Create Account</button>
    </div>
  </div>
</header>

<div class="container-body">
  <div class="content-wrapper">
    <h1>LISTEN.</h1>
    <h1>UPLOAD.</h1>
    <h1>DISCOVER.</h1>

    <form class="login-form" action="/login" method="POST">
      <div class="field">
        <label for="email">Email or Username</label>
        <input type="text" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-submit">Start listening</button>

      <div class="form-footer">
        Don't have an account? <a href="create_account.html">Sign Up</a>
      </div>
    </form>
  </div>
</div>


<script src="js/sign_in.js"></script>
</body>
</html>
